# Isolated Hibernate/JPA verification; the opt-in MySQL tests exercise Flyway separately.
spring.datasource.url=jdbc:h2:mem:legalcell;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=false
app.bootstrap.enabled=false
app.registration.approval.escalation.enabled=false
app.registration.documents.root=${java.io.tmpdir}/legalcell-test-documents
app.security.cookie.secure=false
app.security.cors.allowed-origins=http://localhost:5173
spring.app.secret-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
spring.app.expiration-in-milliseconds=3600000
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.user.pictures.root=${java.io.tmpdir}/legalcell-test-pictures
app.gallery.storage.root=${java.io.tmpdir}/legalcell-test-gallery
app.help.evidence.root=${java.io.tmpdir}/legalcell-test-help-evidence
