spring.application.name=project-2026

#Mysql Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/legalcell
spring.datasource.username=shubham
spring.datasource.password=patil


spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate

#to enable flyway migration . maintains the versioning of database and also helps to manage the database schema changes

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

#File upload configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

#file upload path
app.registration.documents.root=./private-storage/registration-documents

# The latest version of each required type must be VERIFIED before submission.
# RECOMMENDATION_LETTER is always required; append other enum values as needed.
app.registration.submission.required-document-types=RECOMMENDATION_LETTER
app.registration.documents.max-file-bytes=5242880

# One bounded batch of overdue/retryable approval stages per scheduler tick.
app.registration.approval.escalation.enabled=true
app.registration.approval.escalation.batch-size=100
app.registration.approval.escalation.poll-interval-ms=60000
app.registration.approval.escalation.initial-delay-ms=15000

