# Explicit local test profile; use a NEW EMPTY schema, never a production database.
spring.datasource.url=${DEMO_DB_URL:jdbc:mysql://localhost:3306/party_2026_demo}
spring.datasource.username=${DEMO_DB_USERNAME:root}
spring.datasource.password=${DEMO_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

# Set the environment variable before first start. A 12+ character password is required.
app.bootstrap.enabled=true
app.bootstrap.username=partyhead
app.bootstrap.password=${DEMO_BOOTSTRAP_PASSWORD}
app.bootstrap.mobile=+919900009999
app.registration.documents.root=./private-storage/demo-registration-documents
app.user.pictures.root=./private-storage/demo-user-pictures
app.registration.submission.required-document-types=RECOMMENDATION_LETTER
